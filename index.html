<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五六年級運動會：大會舞隊形變換演示 (完美間距版)</title>
<style>
  body { font-family: '微軟正黑體', sans-serif; text-align: center; background-color: #f0f4f8; margin: 0; padding: 20px;}
  #controls { margin-bottom: 20px; padding: 15px; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; width: 950px;}
  #commander-box { background-color: #ffeaa7; border-left: 6px solid #d63031; padding: 12px; margin-bottom: 15px; border-radius: 4px; text-align: left;}
  #commander-title { font-weight: bold; color: #d63031; margin-bottom: 8px; font-size: 18px;}
  #command-text { font-size: 24px; font-weight: bold; color: #2d3436; letter-spacing: 2px;}
  #action-desc { font-size: 16px; color: #636e72; margin-top: 8px; white-space: pre-wrap; line-height: 1.5;} 
  .btn-group { display: flex; justify-content: center; gap: 15px; }
  button { padding: 12px 24px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; transition: 0.3s; font-weight: bold; color: white;}
  button:disabled { background-color: #cccccc !important; cursor: not-allowed; }
  #prevBtn { background-color: #f39c12; }
  #nextBtn { background-color: #0984e3; }
  #resetBtn { background-color: #d63031; }

  #field { position: relative; width: 1200px; height: 800px; margin: 0 auto; background-color: #e17055; border: 4px solid #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.2);}
  #stage { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 250px; height: 50px; background-color: #2d3436; color: white; line-height: 50px; font-size: 24px; font-weight: bold; border-radius: 5px; letter-spacing: 10px; z-index: 5;}
  #center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background-color: rgba(255,255,255,0.7); z-index: 1;}

  /* 地上標線與號碼 */
  .line { position: absolute; top: 80px; width: 2px; height: 100%; background-color: rgba(255,255,255,0.25); z-index: 2;}
  .number { position: absolute; bottom: 20px; color: white; font-weight: bold; font-size: 16px; transform: translateX(-50%); background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px; z-index: 3;}
  
  /* 學生節點設定 */
  .student { position: absolute; border: 2px solid white; text-align: center; font-size: 16px; font-weight: bold; color: white; transition: all 0.6s ease-in-out; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.4);}
  .leader { width: 65px; height: 30px; border-radius: 6px; z-index: 10;} 
  .normal { width: 30px; height: 30px; border-radius: 50%; z-index: 8; }
  
  /* 學生對話框 (喊聲) */
  .shout { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); background: white; color: #d63031; font-size: 16px; padding: 4px 8px; border-radius: 6px; font-weight: bold; display: none; white-space: nowrap; box-shadow: 0 3px 6px rgba(0,0,0,0.3); z-index: 20;}
  .shout::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -6px; border-width: 6px; border-style: solid; border-color: white transparent transparent transparent; }
</style>
</head>
<body>

  <div id="controls">
    <div id="commander-box">
      <div id="commander-title">📢 司令台指令</div>
      <div id="command-text">開幕站位預備</div>
      <div id="action-desc">等待開始</div>
    </div>
    <div class="btn-group">
      <button id="prevBtn" onclick="prevStep()">⏮️ 回到上一步</button>
      <button id="nextBtn" onclick="nextStep()">播放下一步 (1/12)</button>
      <button id="resetBtn" onclick="reset()">🔄 重置</button>
    </div>
  </div>

  <div id="field">
    <div id="stage">司 令 台</div>
    <div id="center-line"></div>
    </div>

<script>
  const field = document.getElementById('field');
  let step = 0;
  const totalSteps = 11; // 0 到 11，共 12 個狀態
  
  // 恢復展示 501~503 與 601~603
  const classes = [
    { id: '501班', grade: 5, openNum: 37, oddNum: 37, evenNum: 36, color: '#0984e3' },
    { id: '502班', grade: 5, openNum: 36, oddNum: 35, evenNum: 34, color: '#6c5ce7' },
    { id: '503班', grade: 5, openNum: 35, oddNum: 33, evenNum: 32, color: '#00b894' },
    { id: '601班', grade: 6, openNum: 38, oddNum: 38, evenNum: 39, color: '#e1b12c' },
    { id: '602班', grade: 6, openNum: 39, oddNum: 40, evenNum: 41, color: '#e84118' },
    { id: '603班', grade: 6, openNum: 40, oddNum: 42, evenNum: 43, color: '#8c7ae6' }
  ];
  
  let studentsData = [];

  // 完整對應您的八段口令
  const script = [
    { cmd: "【開幕站位預備】", desc: "動作：五六年級各班維持一縱列。" }, 
    { cmd: "「五六年級全體同學聽口令，立正！」", desc: "動作：全體同學立正站好並大聲喊「1！ 2！」，待命準備進行隊形變換。" }, 
    { cmd: "「舉班級牌同學～向左向右～～轉！」", desc: "動作：五年級班牌手向左轉；六年級班牌手向右轉（視線看向操場外側）。" }, 
    { cmd: "「就大會舞位置，跑步～～走！」", desc: "動作：班牌手先行脫離原隊伍，平移至指定的「奇數號碼」標線前站定，班級牌面向後舉。" }, 
    { cmd: "「全體同學～向左向右～～轉！」", desc: "動作：五年級全體向左轉；六年級全體向右轉（準備跟隨班牌手）。" }, 
    { cmd: "「就班級牌位置，跑步～～走！」", desc: "動作：學生跑步時雙手打開，取直排間距，仍維持直排。(領跳員此時離開隊伍至司令台前)\n⚠️ 備註提醒：到達位置後請先保持小碎步，不可直接停下，直到聽見立正口令。" }, 
    { cmd: "「全體同學，立正！」", desc: "動作：全體學生停止小碎步，大喊：「1！ 2！」的同時轉回司令台正面。" }, 
    { cmd: "「就大會舞位置，散開！」(喊：1)", desc: "全體同學配合口令大喊：「1！ 2！ 3！ 4！」\n\n喊「1」：偶數排同學往外側踏出第一步。" }, 
    { cmd: "「就大會舞位置，散開！」(喊：2)", desc: "喊「2」：偶數排同學往外側踏出第二步，對齊雙數號標線。" }, 
    { cmd: "「就大會舞位置，散開！」(喊：3)", desc: "喊「3」：偶數排同學往前方踏出第一步。" }, 
    { cmd: "「就大會舞位置，散開！」(喊：4)", desc: "喊「4」：偶數排同學往前方踏出第二步，橫排對齊單數排同學（完成兩縱隊）。" }, 
    { cmd: "「班級牌同學注意！就大會舞位置，跑步～走！」", desc: "動作：班級牌同學聽到「注意」口令時放下班級牌，接著聽口令跑步歸隊。" } 
  ];

  function init() {
    studentsData = [];
    renderStatic();
    
    classes.forEach(cls => {
      for(let i = 0; i <= 6; i++) { // 每班模擬7人 (包含牌)
        let isLdr = (i === 0);
        let el = document.createElement('div');
        let labelSpan = document.createElement('span');
        
        if (isLdr) {
          el.className = 'student leader';
          labelSpan.innerText = cls.id;
        } else {
          el.className = 'student normal';
          labelSpan.innerText = i;
        }
        
        el.style.backgroundColor = cls.color;
        
        let shoutEl = document.createElement('div');
        shoutEl.className = 'shout';
        
        el.appendChild(shoutEl);
        el.appendChild(labelSpan);
        field.appendChild(el);
        
        studentsData.push({ el, shout: shoutEl, label: labelSpan, cls, index: i, isLdr, isEven: (i%2===0 && i!==0), isOdd: (i%2!==0)});
      }
    });
    renderStep(0);
  }

  function renderStatic() {
    field.innerHTML = `<div id="stage">司 令 台</div><div id="center-line"></div>`;
    
    // 【修改亮點 1】拉大中線距離：37號設在 520px，38號設在 680px。中間隔了 160px 超大走道！
    // 畫出 32~37 以及 38~43 的所有標線，確保雙數排散開有線可踩
    for(let i = 32; i <= 37; i++) {
      let x = 520 - (37 - i) * 80;
      field.innerHTML += `<div class="line" style="left: ${x}px;"></div><div class="number" style="left: ${x}px;">${i}</div>`;
    }
    for(let i = 38; i <= 43; i++) {
      let x = 680 + (i - 38) * 80;
      field.innerHTML += `<div class="line" style="left: ${x}px;"></div><div class="number" style="left: ${x}px;">${i}</div>`;
    }
  }

  // 計算 X 座標 (配合上面加寬的設定)
  function getX(grade, num) {
    if(grade === 5) return 520 - (37 - num) * 80;
    if(grade === 6) return 680 + (num - 38) * 80;
  }
  
  // 【修改亮點 2】雙重 Y 座標系統，呈現「取直排間距」的視覺效果
  function getY_initial(index) { return 180 + index * 45; } // 開幕時較密集
  function getY_expanded(index) { return 180 + index * 80; } // 跑步定位後，雙手打開的寬間距

  function renderStep(sIdx) {
    document.getElementById('command-text').innerText = script[sIdx].cmd;
    document.getElementById('action-desc').innerText = script[sIdx].desc;
    document.getElementById('nextBtn').innerText = sIdx < totalSteps ? `播放下一步 (${sIdx + 1}/${totalSteps + 1})` : "✅ 演示完畢";
    document.getElementById('nextBtn').disabled = sIdx === totalSteps;
    document.getElementById('prevBtn').disabled = sIdx === 0;

    studentsData.forEach(s => {
      s.shout.style.display = 'none'; // 隱藏所有喊聲
      
      let curX = getX(s.cls.grade, s.cls.openNum);
      
      // 根據步驟決定縱向間距 (步驟 5 開始拉開直排間距)
      let curY = sIdx < 5 ? getY_initial(s.index) : getY_expanded(s.index);

      // 步驟 3: 班牌手平移定位
      if (sIdx >= 3 && s.isLdr) curX = getX(s.cls.grade, s.cls.oddNum); 
      // 步驟 5: 學生跟進定位
      if (sIdx >= 5 && !s.isLdr) curX = getX(s.cls.grade, s.cls.oddNum); 

      // 步驟 1: 預備立正喊 1! 2!
      if (sIdx === 1) {
        s.shout.innerText = '1! 2!';
        s.shout.style.display = 'block';
      }

      // 步驟 6: 動作收整喊 1! 2!
      if (sIdx === 6 && !s.isLdr) {
        s.shout.innerText = '1! 2!';
        s.shout.style.display = 'block';
      }

      // 步驟 7-10: 散開四步
      if (sIdx >= 7 && sIdx <= 10 && !s.isLdr) {
        let targetX = getX(s.cls.grade, s.cls.evenNum);
        let targetY = getY_expanded(s.index - 1); // 往前遞補的目標位置
        
        if (sIdx === 7) { s.shout.innerText = '1!'; s.shout.style.display = 'block'; if (s.isEven) curX = (curX + targetX) / 2; }
        // 步驟 8: 精準對齊「雙數號碼標線」
        if (sIdx === 8) { s.shout.innerText = '2!'; s.shout.style.display = 'block'; if (s.isEven) curX = targetX; }
        if (sIdx === 9) { s.shout.innerText = '3!'; s.shout.style.display = 'block'; if (s.isEven) { curX = targetX; curY = (curY + targetY) / 2; } }
        if (sIdx >= 10) { 
          if(sIdx === 10) { s.shout.innerText = '4!'; s.shout.style.display = 'block'; }
          if (s.isEven) { curX = targetX; curY = targetY; } 
        }
      }

      // 步驟 11: 班級牌同學歸隊 (圓形變化)
      if (sIdx >= 11) {
        if (s.isEven) { curX = getX(s.cls.grade, s.cls.evenNum); curY = getY_expanded(s.index - 1); }
        if (s.isLdr) {
          s.el.classList.remove('leader');
          s.el.classList.add('normal');
          s.label.innerText = '牌';
        }
      } else if (s.isLdr) {
        s.el.classList.remove('normal');
        s.el.classList.add('leader');
        s.label.innerText = s.cls.id;
      }

      // 更新座標
      s.el.style.left = curX + 'px';
      s.el.style.top = curY + 'px';
    });
  }

  function nextStep() { if (step < totalSteps) renderStep(++step); }
  function prevStep() { if (step > 0) renderStep(--step); }
  function reset() { step = 0; renderStep(0); }
  window.onload = init;
</script>
</body>
</html>
