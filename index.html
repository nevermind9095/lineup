<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五六年級大會舞隊形變換演示 (最新口令版)</title>
<style>
  body { font-family: '微軟正黑體', sans-serif; text-align: center; background-color: #f0f4f8; margin: 0; padding: 20px;}
  
  /* 控制台與口令顯示區 */
  #controls { margin-bottom: 20px; padding: 15px; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; width: 900px;}
  #commander-box { background-color: #ffeaa7; border-left: 6px solid #d63031; padding: 12px; margin-bottom: 15px; border-radius: 4px; text-align: left;}
  #commander-title { font-weight: bold; color: #d63031; margin-bottom: 8px; font-size: 18px;}
  #command-text { font-size: 26px; font-weight: bold; color: #2d3436; letter-spacing: 2px;}
  #action-desc { font-size: 18px; color: #636e72; margin-top: 8px;}
  
  /* 按鈕樣式 */
  .btn-group { display: flex; justify-content: center; gap: 15px; }
  button { padding: 12px 24px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; transition: 0.3s; font-weight: bold; color: white;}
  button:disabled { background-color: #cccccc !important; cursor: not-allowed; transform: none !important; box-shadow: none !important;}
  
  #prevBtn { background-color: #f39c12; }
  #prevBtn:hover:not(:disabled) { background-color: #e67e22; transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.2);}
  
  #nextBtn { background-color: #0984e3; }
  #nextBtn:hover:not(:disabled) { background-color: #74b9ff; transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.2);}
  
  #resetBtn { background-color: #d63031; }
  #resetBtn:hover:not(:disabled) { background-color: #ff7675; transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.2);}
  
  /* 操場設定 */
  #field { position: relative; width: 1200px; height: 800px; margin: 0 auto; background-color: #e17055; border: 4px solid #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.2);}
  
  /* 司令台 */
  #stage { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 250px; height: 50px; background-color: #2d3436; color: white; line-height: 50px; font-size: 24px; font-weight: bold; border-radius: 5px; letter-spacing: 10px; z-index: 5;}
  
  /* 中線與區域提示 */
  #center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background-color: rgba(255,255,255,0.7); z-index: 1;}
  .area-text { position: absolute; top: 100px; color: rgba(255,255,255,0.4); font-size: 36px; font-weight: bold; z-index: 1;}
  #left-text { left: 20%; transform: translateX(-50%); }
  #right-text { right: 20%; transform: translateX(50%); }

  /* 地上標線與號碼 */
  .line { position: absolute; top: 80px; width: 2px; height: 100%; background-color: rgba(255,255,255,0.25); z-index: 2;}
  .number { position: absolute; bottom: 20px; color: white; font-weight: bold; font-size: 18px; transform: translateX(-50%); background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 4px; z-index: 3;}
  
  /* 學生節點設定 */
  .student { position: absolute; border-radius: 50%; border: 2px solid white; text-align: center; font-size: 16px; font-weight: bold; color: white; transition: all 0.4s ease-in-out; transform: translate(-50%, -50%); box-shadow: 0 4px 8px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;}
  .leader { width: 65px; height: 30px; border-radius: 6px; z-index: 10;} 
  .normal { width: 30px; height: 30px; z-index: 8; }
  
  /* 學生對話框 (喊聲) */
  .shout { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); background: white; color: #d63031; font-size: 16px; padding: 4px 8px; border-radius: 6px; font-weight: bold; display: none; white-space: nowrap; box-shadow: 0 3px 6px rgba(0,0,0,0.3); z-index: 20;}
  .shout::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -6px; border-width: 6px; border-style: solid; border-color: white transparent transparent transparent; }

</style>
</head>
<body>

  <div id="controls">
    <div id="commander-box">
      <div id="commander-title">📢 司令台指令</div>
      <div id="command-text">開幕站位預備</div>
      <div id="action-desc">動作說明：五年級在左側，六年級在右側，各班維持一縱列。</div>
    </div>
    
    <div class="btn-group">
      <button id="prevBtn" onclick="prevStep()">⏮️ 回到上一步</button>
      <button id="nextBtn" onclick="nextStep()">播放下一步 (1/11)</button>
      <button id="resetBtn" onclick="reset()">🔄 重置回原點</button>
    </div>
  </div>

  <div id="field">
    </div>

<script>
  const field = document.getElementById('field');
  let step = 0;
  const totalSteps = 10;
  
  // 模擬班級資料 
  const classes = [
    // 左半場：五年級
    { id: '501班', grade: 5, openNum: 37, oddNum: 37, evenNum: 36, color: '#0984e3' },
    { id: '502班', grade: 5, openNum: 36, oddNum: 35, evenNum: 34, color: '#6c5ce7' },
    { id: '503班', grade: 5, openNum: 35, oddNum: 33, evenNum: 32, color: '#00b894' },
    // 右半場：六年級
    { id: '601班', grade: 6, openNum: 38, oddNum: 38, evenNum: 39, color: '#e1b12c' },
    { id: '602班', grade: 6, openNum: 39, oddNum: 40, evenNum: 41, color: '#e84118' },
    { id: '603班', grade: 6, openNum: 40, oddNum: 42, evenNum: 43, color: '#8c7ae6' }
  ];
  
  let studentsData = [];

  // ✅ 融入您最新版的精簡口令與動作
  const script = [
    { cmd: "開幕站位預備", desc: "動作說明：五年級在左側，六年級在右側，各班維持一縱列。" }, // 0
    { cmd: "「五六年級全體同學聽口令，立正！」", desc: "動作說明：全體學生停止動作、待命變換。" }, // 1
    { cmd: "「舉班級牌同學～向左向右——轉！」", desc: "動作說明：五年級班牌手向左轉；六年級班牌手向右轉。" }, // 2
    { cmd: "「就大會舞位置，起步——走！」", desc: "動作說明：班牌手先行脫離隊伍，平移至指定的奇數號碼標線前站定。" }, // 3
    { cmd: "「全體同學～向左向右——轉！」", desc: "動作說明：五年級全體向左轉；六年級全體向右轉，準備跟隨班牌手。" }, // 4
    { cmd: "「就班級牌位置，跑步——走！」", desc: "動作說明：學生跑步至班牌手後方，維持一縱列。（⚠️ 備註提醒：到達後保持小碎步）" }, // 5
    { cmd: "「全體同學，立正！」", desc: "動作說明：全體學生停止小碎步，並齊喊『1！ 2！』。" }, // 6
    { cmd: "「就大會舞位置，散開！」(喊：1 !)", desc: "動作說明：全體喊 1！偶數排同學往外側踏出第一步。" }, // 7
    { cmd: "「就大會舞位置，散開！」(喊：2 !)", desc: "動作說明：全體喊 2！偶數排同學往外側踏第二步，對齊雙數號標線。" }, // 8
    { cmd: "「就大會舞位置，散開！」(喊：3 !)", desc: "動作說明：全體喊 3！偶數排同學往前方踏出第一步。" }, // 9
    { cmd: "「就大會舞位置，散開！」(喊：4 !)", desc: "動作說明：全體喊 4！偶數排同學往前方踏第二步，橫排對齊單數排同學！" } // 10
  ];

  function init() {
    const staticHTML = `
      <div id="stage">司 令 台</div>
      <div id="center-line"></div>
      <div id="left-text" class="area-text">五年級區域</div>
      <div id="right-text" class="area-text">六年級區域</div>
    `;
    field.innerHTML = staticHTML;
    studentsData = [];
    
    // 間距：中線在 600px。
    // 五年級標線 (32~37)，37號在 520px，間距 80px
    for(let i = 32; i <= 37; i++) {
      let x = 520 - (37 - i) * 80;
      field.innerHTML += `<div class="line" style="left: ${x}px;"></div><div class="number" style="left: ${x}px;">${i}</div>`;
    }
    // 六年級標線 (38~43)，38號在 680px，間距 80px
    for(let i = 38; i <= 43; i++) {
      let x = 680 + (i - 38) * 80;
      field.innerHTML += `<div class="line" style="left: ${x}px;"></div><div class="number" style="left: ${x}px;">${i}</div>`;
    }

    // 產生學生節點
    classes.forEach(cls => {
      for(let i = 0; i <= 6; i++) { 
        let isLeader = (i === 0);
        let el = document.createElement('div');
        let shoutEl = document.createElement('div'); 
        shoutEl.className = 'shout';
        el.appendChild(shoutEl);

        if (isLeader) {
          el.className = 'student leader';
          el.style.backgroundColor = cls.color;
          el.innerHTML += cls.id; 
        } else {
          el.className = 'student normal';
          el.style.backgroundColor = cls.color;
          el.innerHTML += i; 
        }
        
        field.appendChild(el);
        
        studentsData.push({
          element: el,
          shoutBox: el.querySelector('.shout'),
          classData: cls,
          index: i,
          isLeader: isLeader,
          isEven: (i % 2 === 0 && i !== 0),
          isOdd: (i % 2 !== 0)
        });
      }
    });
    
    renderStep(0);
  }

  // 取得 X 座標
  function getX(grade, num) {
    if(grade === 5) return 520 - (37 - num) * 80;
    if(grade === 6) return 680 + (num - 38) * 80;
  }
  
  // 取得 Y 座標 
  function getY_open(index) { return 180 + index * 80; }

  function renderStep(targetStep) {
    // 更新 UI 文字
    document.getElementById('command-text').innerText = script[targetStep].cmd;
    document.getElementById('action-desc').innerText = script[targetStep].desc;
    
    let prevBtn = document.getElementById('prevBtn');
    let nextBtn = document.getElementById('nextBtn');
    
    // 判斷「上一步」按鈕狀態
    if (targetStep > 0) {
      prevBtn.disabled = false;
    } else {
      prevBtn.disabled = true;
    }

    // 判斷「下一步」按鈕狀態
    if (targetStep < totalSteps) {
      nextBtn.innerText = `播放下一步 (${targetStep + 1}/${totalSteps + 1})`;
      nextBtn.disabled = false;
    } else {
      nextBtn.innerText = "✅ 演示完畢";
      nextBtn.disabled = true;
    }

    // 執行對應動作
    studentsData.forEach(s => {
      s.shoutBox.style.display = 'none'; // 先隱藏所有氣泡
      
      let currentX = getX(s.classData.grade, s.classData.openNum);
      let currentY = getY_open(s.index);

      // 步驟 3: 班牌手平移
      if (targetStep >= 3) {
        if (s.isLeader) currentX = getX(s.classData.grade, s.classData.oddNum);
      }
      // 步驟 5: 所有人跟上班牌手平移
      if (targetStep >= 5) {
        currentX = getX(s.classData.grade, s.classData.oddNum);
      }
      
      // 步驟 6: 立正喊聲
      if (targetStep === 6 && !s.isLeader) {
        s.shoutBox.innerText = '1! 2!';
        s.shoutBox.style.display = 'block';
      }

      // 步驟 7~10: 散開的四個分解動作
      if (targetStep >= 7 && !s.isLeader) {
        let startX = getX(s.classData.grade, s.classData.oddNum);
        let targetX = getX(s.classData.grade, s.classData.evenNum);
        let startY = getY_open(s.index);
        let targetY = getY_open(s.index - 1); // 往前遞補的位置

        if (targetStep === 7) {
          s.shoutBox.innerText = '1!';
          s.shoutBox.style.display = 'block';
          if (s.isEven) { currentX = (startX + targetX) / 2; } // X 踏一半
        }
        if (targetStep === 8) {
          s.shoutBox.innerText = '2!';
          s.shoutBox.style.display = 'block';
          if (s.isEven) { currentX = targetX; } // X 就定位
        }
        if (targetStep === 9) {
          s.shoutBox.innerText = '3!';
          s.shoutBox.style.display = 'block';
          if (s.isEven) { currentX = targetX; currentY = (startY + targetY) / 2; } // Y 踏一半
        }
        if (targetStep === 10) {
          s.shoutBox.innerText = '4!';
          s.shoutBox.style.display = 'block';
          if (s.isEven) { currentX = targetX; currentY = targetY; } // Y 完美對齊
        }
      }

      // 套用座標
      s.element.style.left = currentX + 'px';
      s.element.style.top = currentY + 'px';
    });
  }

  function nextStep() {
    if (step < totalSteps) {
      step++;
      renderStep(step);
    }
  }

  function prevStep() {
    if (step > 0) {
      step--;
      renderStep(step);
    }
  }

  function reset() {
    step = 0;
    renderStep(0);
  }

  // 自動延遲初始化以確保字體載入
  window.onload = init;
</script>
</body>
</html>
